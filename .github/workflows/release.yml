name: Release

run-name: Release v${{ inputs.version }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without v prefix. Example: 0.3.1"
        required: true
        type: string
      prerelease:
        description: "Mark this as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ inputs.version }}"
          TAG="v${VERSION}"
          SEMVER_REGEX='^(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)([.](0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?$'

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Releases must be run from main. Current ref: ${GITHUB_REF}"
            exit 1
          fi

          if [[ ! "$VERSION" =~ $SEMVER_REGEX ]]; then
            echo "Invalid version: $VERSION"
            echo "Use a semver version like 0.3.1 or 0.4.0-beta.1"
            exit 1
          fi

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').version")"
          LOCK_PACKAGE_VERSION="$(node -p "require('./package-lock.json').packages[''].version")"

          if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "package.json version is $PACKAGE_VERSION, expected $VERSION"
            exit 1
          fi

          if [[ "$LOCK_VERSION" != "$VERSION" ]]; then
            echo "package-lock.json version is $LOCK_VERSION, expected $VERSION"
            exit 1
          fi

          if [[ "$LOCK_PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "package-lock.json root package version is $LOCK_PACKAGE_VERSION, expected $VERSION"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "Tag ${TAG} already exists"
            exit 1
          fi

      - name: Create and push annotated tag
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ inputs.version }}"
          TAG="v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION="${{ inputs.version }}"
          TAG="v${VERSION}"

          ARGS=(
            "$TAG"
            --verify-tag
            --generate-notes
            --fail-on-no-commits
            --title "$TAG"
          )

          if [[ "${{ inputs.prerelease }}" == "true" ]]; then
            ARGS+=(--prerelease)
          fi

          gh release create "${ARGS[@]}"
